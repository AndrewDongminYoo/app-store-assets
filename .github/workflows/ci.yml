name: CI

on:
  pull_request:
    branches: [main, split/offline-read-boundaries]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CLI tests and Ruby syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install ImageMagick 7
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install imagemagick
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Run CLI regression tests
        run: |
          magick -version
          python3 -m unittest discover -s tests -v
      - name: Check Ruby syntax
        run: |
          ruby -c lib/fastlane_assets.rb
          ruby -c tests/fastlane_harness.rb
