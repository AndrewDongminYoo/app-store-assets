name: CI

on:
  pull_request:
    branches: [main, split/offline-read-boundaries]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CLI tests and Ruby syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test TruffleHog filesystem reader
        run: python3 -m unittest discover -s .trunk/configs/tests -v
      - name: Install ImageMagick 7
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install imagemagick
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Run CLI regression tests
        run: |
          magick -version
          python3 -m unittest discover -s tests -v
      - name: Check Ruby syntax
        run: |
          ruby -c lib/fastlane_assets.rb
          ruby -c tests/fastlane_harness.rb
          ruby -c tests/snapshot_export_harness.rb
          ruby -c tests/fake_spaceship/spaceship.rb
